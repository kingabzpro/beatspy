title = "Six-month weekly traded portfolio"
description = "Version 3: a weekly decision across the six-month window, trading stocks plus gold, oil, and bond hedges. SPY is comparison-only."
start = "2026-04-06"
end = "2026-10-02"
frequency = "weekly"
pipeline = "team"
protocol_version = 9
# The fixed large-company core is feasible evidence, not a required portfolio.
reference_kind = "core"
benchmark = "SPY"
tradable = [
  "AAPL", "MSFT", "NVDA", "GOOGL", "META", "AMZN", "AVGO",
  "JPM", "V", "BRK-B",
  "LLY", "JNJ", "UNH",
  "XOM", "CVX",
  "CAT", "GE", "UPS",
  "WMT", "PG", "COST",
  "NEE", "LIN", "PLD",
  "GLD", "USO", "TLT",
]
universe_groups = { stocks = [
  "AAPL", "MSFT", "NVDA", "GOOGL", "META", "AMZN", "AVGO",
  "JPM", "V", "BRK-B",
  "LLY", "JNJ", "UNH",
  "XOM", "CVX",
  "CAT", "GE", "UPS",
  "WMT", "PG", "COST",
  "NEE", "LIN", "PLD",
], hedges = ["GLD", "USO", "TLT"] }
require_min_names = 5
# Scored as buy-and-hold market assets beside SPY, so an oil/gold hedge can be
