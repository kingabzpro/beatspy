title = "Latest 6 months"
description = "Rolling six-month window ending at the latest completed NYSE session, with weekly decisions over 25 stocks and ETFs."
# Rolling: `start` is resolved as six months before the latest completed session,
# so this scenario never ages into an old period.
recent_months = 6
frequency = "weekly"
max_decisions = 26
benchmark = "SPY"
# The pool of 25 assets: large companies across all 11 sectors, plus broad
# equities and long Treasuries. SPY is not listed here: it is the yardstick,
# never a holding.
#
# The momentum filter is off. Measured over 2026-04-09 to 2026-10-09, holding
# the trailing winners lost to simply holding the pool: the top twelve returned
# -0.94%, the top twenty +5.31%, the whole pool +9.09%. The knob is kept
# (`selection_top`, `selection_lookback_days`) because the ranking is
# point-in-time, but a filter has to earn its place and this one did not.
tradable = [
  "AAPL", "MSFT", "NVDA", "GOOGL", "META",
  "AMZN", "HD", "WMT", "PG", "COST",
  "JPM", "V", "LLY", "JNJ", "UNH",
  "XOM", "CVX", "CAT", "GE", "NEE",
  "LIN", "PLD", "AMT", "QQQ", "TLT",
]
max_candidates = 10
lookback_days = 400