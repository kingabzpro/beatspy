# Example BeatSPY configuration.
# Copy the relevant tables into ~/.beatspy/config.toml (created by `beatspy setup`).
# API keys are never stored here: they go to ~/.beatspy/secrets.env (git-excluded),
# or can be provided as environment variables instead.

[decision]
# Which decision model to benchmark. Run `beatspy models` for the current list:
#   gpt-6-luna  OpenAI Decisions API       $0.10 / 1M input
#   jev-latest  TypeSafe Jev                $0.042 / 1M input
#   clef        Cloudflare Clef (27B)       $0.24 / 1M input
#   clef-flash  Cloudflare Clef-flash (9B)  $0.09 / 1M input
# Decision models bill input tokens only: output and cache are free everywhere.
decision_model = "clef-flash"

# Transport and retry behaviour. 429/529/5xx are retried with exponential backoff.
timeout_s = 120.0
max_retries = 4

# The sizing policy. Fixed here so a run cannot be tuned after seeing a result.
# Only noul probabilities enter the portfolio.
#   core_satellite (default): `core_weight` of the book holds the benchmark
#     itself and the rest is a satellite sleeve allocated by cross-sectional
#     conviction, so the portfolio tracks the index and "excess vs SPY" measures
#     the model's active sleeve. The index core is exempt from the position cap.
#   graded_cs: fully invested across the universe, sized by each probability's
#     distance above the decision's own mean (invariant to a provider's scale).
#   graded: the original rule, conviction above the fixed 0.5 prior.
#   top_n: the legacy top-N cut, kept so recorded runs stay reproducible.
selection = "core_satellite"
core_weight = 0.85
# Share of the sleeve (or of the whole book under graded_cs) allocated by
# conviction; the remainder is an even spread.
base_weight = 0.5
min_probability = 0.5
top_n = 3
min_names = 2

# State budget in tokens. Workers AI silently truncates long text state to roughly
# its first 2K tokens, so the state is kept inside this bound for every provider.
max_state_tokens = 1800

# Optional overrides (normally taken from the decision-model registry)
# base_url = "https://api.typesafe.ai/v1/systemone"
# api_key_env = "TYPESAFE_API_KEY"

[bench]
initial_capital = 100000.0
fee_bps = 5.0
slippage_bps = 5.0
max_position_weight = 0.35
risk_free_annual = 0.0