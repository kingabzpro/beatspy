[project]
name = "beatspy"
version = "0.3.0"
description = "Benchmark decision models, not chat models: do calibrated probabilities about markets become a portfolio that beats SPY?"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Abid Ali Awan" }]
keywords = ["decision-model", "calibration", "benchmark", "trading", "backtesting", "finance", "spy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "pandas>=2.2",
  "numpy>=1.26",
  "httpx>=0.27",
  "exchange-calendars>=4.11,<5",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
beatspy = "beatspy.cli:main"

[project.urls]
Homepage = "https://github.com/kingabzpro/beatspy"
Repository = "https://github.com/kingabzpro/beatspy"
Issues = "https://github.com/kingabzpro/beatspy/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beatspy"]

[tool.hatch.build.targets.wheel.force-include]
"dashboard/index.html" = "beatspy/reporting/static/index.html"
"dashboard/styles.css" = "beatspy/reporting/static/styles.css"
"dashboard/app.js" = "beatspy/reporting/static/app.js"
"dashboard/assets" = "beatspy/reporting/static/assets"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Fixture data and expected-value tables read better as long literals.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
