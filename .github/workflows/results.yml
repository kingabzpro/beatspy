name: Validate submitted results
on:
  pull_request:
    paths:
      - 'dashboard/data/**'
      - '.github/workflows/results.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: submitted
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install base-branch validator
        working-directory: trusted
        run: uv sync --frozen
      - name: Check owner-requested empty leaderboard reset
        id: reset
        env:
          REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('submitted/dashboard/data')
          if root.is_symlink() or any(p.is_symlink() for p in root.rglob('*')):
              raise SystemExit('Artifact symlinks are not accepted.')
          expected = {'schema_version': 1, 'default_trust': 'all', 'runs': []}
          files = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          empty = (json.loads((root / 'index.json').read_text()) == expected
                   and files <= {'index.json', 'runs/.gitkeep', 'snapshots/.gitkeep'})
          reset = empty and os.environ['REQUEST_AUTHOR'] == os.environ['REPOSITORY_OWNER']
          if empty and not reset:
              raise SystemExit('Only the repository owner can request an empty leaderboard reset.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'is_reset={str(reset).lower()}\n')
          PY
      - name: Verify signatures and replay using trusted code
        if: steps.reset.outputs.is_reset != 'true' && hashFiles('trusted/src/beatspy/bench/verification.py') != ''
        working-directory: trusted
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          from beatspy import __version__
          from beatspy.artifacts import sha256
          from beatspy.bench.verification import code_digest, verify_result
          from beatspy.reporting.catalog import build_catalog
          data = Path('../submitted/dashboard/data')
          key = Path('.github/verification-key.pem')
          def files(directory):
              if directory.is_symlink() or any(p.is_symlink() for p in directory.rglob('*')):
                  raise SystemExit('Artifact symlinks are not accepted.')
              return {p.relative_to(directory).as_posix(): sha256(p)
                      for p in directory.rglob('*') if p.is_file() and not p.is_symlink()}
          for baseline in Path('dashboard/data/runs').iterdir():
              if not baseline.is_dir():
                  continue
              current = data / 'runs' / baseline.name
              if not current.is_dir() or files(current) != files(baseline):
                  raise SystemExit('Published runs are immutable. Submit a new trusted rerun.')
          for directory in (data / 'runs').iterdir():
              if not directory.is_dir():
                  continue
              baseline = Path('dashboard/data/runs') / directory.name
              if not baseline.exists():
                  payload = verify_result(directory, key.read_bytes(), release=(__version__, code_digest()))
                  from beatspy.bench.validation import read_json
                  meta = read_json(directory / 'run.json')
                  if meta['scenario']['name'] != '2026-ytd' or meta['requested']['start'] != '2026-01-01':
                      raise SystemExit('New leaderboard results must use the 2026 year-to-date benchmark.')
                  from beatspy.scenarios import load_scenario
                  if (meta['protocol_version'] != 4
                          or meta['scenario']['tradable'] != load_scenario('2026-ytd').tradable
                          or meta['scenario']['benchmark'] != 'SPY'
                          or meta['scenario'].get('max_decisions') != load_scenario('2026-ytd').max_decisions
                          or meta['scenario'].get('frequency') != load_scenario('2026-ytd').frequency
                          or meta['capabilities'].get('web_search_tools')
                          or meta['scenario'].get('allow_web_search')):
                      raise SystemExit('New results must use the approved decision limit without web research.')
          original = (data / 'index.json').read_bytes()
          build_catalog(data, public_key=key)
          if (data / 'index.json').read_bytes() != original:
              raise SystemExit('Catalog mismatch. Regenerate using the trusted catalog builder.')
          PY
      - name: Bootstrap signature validation without accepting new results
        if: steps.reset.outputs.is_reset != 'true' && hashFiles('trusted/src/beatspy/bench/verification.py') == ''
        working-directory: trusted
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          from beatspy.artifacts import sha256
          from beatspy.reporting.catalog import build_catalog
          def artifacts(root):
              if any(p.is_symlink() for p in root.rglob('*')):
                  raise SystemExit('Artifact symlinks are not accepted.')
              return {p.relative_to(root).as_posix(): sha256(p)
                      for name in ('runs', 'snapshots') for p in (root / name).rglob('*') if p.is_file()}
          baseline = Path('dashboard/data')
          submitted = Path('../submitted/dashboard/data')
          if artifacts(baseline) != artifacts(submitted):
              raise SystemExit('Merge the signature validator before adding or changing results.')
          runs = build_catalog(baseline)
          for run in runs:
              run['trust'] = 'replayed'
          expected = {'schema_version': 1, 'default_trust': 'all', 'runs': runs}
          if json.loads((submitted / 'index.json').read_text()) != expected:
              raise SystemExit('Bootstrap catalog must retain exact existing results with unsigned labels.')
          PY
